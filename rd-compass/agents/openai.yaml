interface:
  display_name: "研发罗盘"
  short_description: "从专利证据研判技术趋势，区分近期预研与中长期储备"
  default_prompt: "请使用 $rd-compass 分析这些产品或技术材料，按我的研究目的选择技术理解与演进、机会探索或路线比较。先讲清必要的产品背景和现有路线，再提出有依据的方向；保留主动补证，区分阅读、复核和证据展示。初筛后先落实每份专利的阅读范围与深度，再交给专利阅读 Skill。已有明确安排直接沿用，其余只问必要的简短问题。按确认范围补查，将结果写回判断。报告先解释产品与机制，再讲机会与条件取舍；补查过程和方法详情可展开，剩余问题的不同结果直接说明怎样改变选择。额外方法按问题启用。面向未来储备时按 13 章输出近期验证与中长期积累，需要空白模板时导出可填写网页。"
