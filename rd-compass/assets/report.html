ize:var(--small);color:var(--muted)}.e-detail{padding:0 18px 18px;font-size:15px}.e-detail p{margin-top:9px}.e-detail strong{color:var(--accent)}.empty{padding:22px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);background:var(--paper)}.worklog{margin:0;padding-left:24px}.worklog li{padding:12px 0}.worklog p{font-size:15px}.appendix{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-top:18px}.appendix summary{padding:14px 18px;font-weight:750}.appendix-body{padding:0 18px 18px;font-size:var(--small)}.appendix-body p{white-space:pre-wrap;margin-top:10px}footer{border-top:1px solid var(--line);padding-top:18px;margin-top:30px;color:var(--muted);font-size:var(--small)}

<noscript><style>.comparison [data-column]{display:table-cell!important}.comparison{min-width:740px}.compare-control,.filter,.toolbar{display:none!important}/* Keep expanded research navigation usable without covering section headings. */
.top nav{min-width:0}.top .wrap{min-width:0}

</style><p class="wrap">脚本未启用；正文、证据详情和来源仍可阅读，筛选暂不可用。</p></noscript>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('report-data').textContent);
const field=document.getElementById('compare-field');field?.addEventListener('change',()=>document.querySelector('.comparison').dataset.field=field.value);
const search=document.getElementById('e-search'),filter=document.getElementById('e-filter');
const entries=[...document.querySelectorAll('.evidence-item')];
function filterEvidence(){const term=search.value.trim().toLowerCase();let count=0;entries.forEach(el=>{el.hidden=!(el.textContent.toLowerCase().includes(term)&&(!filter.value||el.dataset.routes.split(' ').includes(filter.value)));if(!el.hidden)count++});document.getElementById('e-count').textContent=count+(data.schema_version===2?' 张详细证据卡':' 个条目');document.getElementById('e-empty').hidden=count!==0}
search?.addEventListener('input',filterEvidence);filter?.addEventListener('change',filterEvidence);
document.getElementById('e-reset')?.addEventListener('click',()=>{search.value='';filter.value='';filterEvidence();search.focus()});
document.addEventListener('click',event=>{const link=event.target.closest('.e-link');if(!link)return;const el=document.getElementById(link.hash.slice(1));if(!el)return;search.value='';filter.value='';filterEvidence();el.open=true;requestAnimationFrame(()=>el.querySelector('summary').focus({preventScroll:true}))});
document.getElementById('print')?.addEventListener('click',()=>window.print());
let printState;window.addEventListener('beforeprint',()=>{if(printState)return;printState={details:[...document.querySelectorAll('details')].map(el=>[el,el.open]),entries:entries.map(el=>[el,el.hidden])};printState.details.forEach(([el])=>el.open=true);entries.forEach(el=>el.hidden=false)});
window.addEventListener('afterprint',()=>{if(!printState)return;printState.details.forEach(([el,open])=>el.open=open);printState.entries.forEach(([el,hidden])=>el.hidden=hidden);printState=null});
const download=document.getElementById('data-download');if(download)download.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(data,null,2));
</script></body></html>
